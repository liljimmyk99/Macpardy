name: CI

# Runs the tests and a full export on every PR, so a broken build or export shows up
# before it reaches master. The DMG is attached to the run for trying the change.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # export.sh counts commits for the build number

      - uses: ./.github/actions/setup-build

      - name: Generate project
        run: tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -project Macpardy.xcodeproj \
            -scheme Macpardy \
            -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=-

      # The buzzer core's tests live in its package, not in the Xcode scheme (#100).
      - name: Test buzzer package
        run: swift test --package-path Packages/MacpardyBuzzer

      - name: Export
        run: ./scripts/export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Macpardy-dmg
          path: build/exports/Macpardy.dmg
          retention-days: 14

  # The buzzer package on Linux, where the self-hosted server runs (#103), and its image.
  buzzer-server-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: Test buzzer package
        run: swift test --package-path Packages/MacpardyBuzzer

  buzzer-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # global WebSocket, for the smoke test

      - name: Build image
        run: docker build -t macpardy-buzzer-server Packages/MacpardyBuzzer

      - name: Smoke test
        run: |
          token="$(openssl rand -hex 24)"
          docker run -d --name buzzer -p 8472:8472 -e MACPARDY_HOST_TOKEN="$token" macpardy-buzzer-server
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8472/healthz && break; sleep 1; done
          node Packages/MacpardyBuzzer/scripts/smoke-test.mjs http://127.0.0.1:8472 "$token"
          docker logs buzzer
