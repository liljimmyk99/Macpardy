name: Release

# Publishes a GitHub release for the MARKETING_VERSION in Project.swift. Runs only when
# started by hand (Actions tab › Release › Run workflow, or `gh workflow run release.yml`).
# The tag is the bare version (e.g. 0.5.0); the run fails if that tag already exists.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for the existence check, commits for the build number

      - name: Read version
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Releases are cut from master; this run was started on $GITHUB_REF."
            exit 1
          fi
          versions="$(sed -n 's/.*"MARKETING_VERSION": "\([^"]*\)".*/\1/p' Project.swift)"
          if [[ "$(wc -l <<< "$versions")" -ne 1 || ! "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Project.swift::Expected exactly one MARKETING_VERSION like 1.2.3, found: $versions"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$versions" >/dev/null; then
            echo "::error file=Project.swift::Version $versions is already released. Bump MARKETING_VERSION first."
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-build

      - name: Generate project
        run: tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -project Macpardy.xcodeproj \
            -scheme Macpardy \
            -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=-

      - name: Export
        run: ./scripts/export.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" build/exports/Macpardy.dmg \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
